# Include inside SurakshaAR's HTTPS server block. Only the public Next build
# directory is served here; application routes and APIs keep their own limits.
location ^~ /_next/static/ {
 alias /opt/surakshaar/current/apps/admin-web/.next/static/;
 autoindex off;
 limit_except GET { deny all; }
 add_header Cache-Control "public, max-age=31536000, immutable";
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
}
